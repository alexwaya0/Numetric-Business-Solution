<header class="fixed inset-x-0 top-0 z-50">

    <div class="mx-auto max-w-8xl px-4 pt-4 sm:px-6 lg:px-8">

        <div class="flex items-center justify-between rounded-full border border-black/10 bg-white/95 px-4 py-3 shadow-lg shadow-black/[0.04] backdrop-blur-xl sm:px-6">

            <!-- BRAND -->

            <a
                href="{% url 'website:home' %}"
                class="flex items-center gap-3"
                aria-label="Numetric Business Solution"
            >

                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-numetric-green text-white">

                    <span class="text-lg font-extrabold">
                        N
                    </span>

                </div>

                <div class="leading-none">

                    <div class="text-base font-extrabold tracking-tight">
                        Numetric
                    </div>

                    <div class="mt-1 text-[9px] font-medium uppercase tracking-[0.18em] text-numetric-muted">
                        Business Solution
                    </div>

                </div>

            </a>


            <!-- DESKTOP NAV -->

            <nav
                class="hidden items-center gap-8 lg:flex"
                aria-label="Primary navigation"
            >

                <a
                    href="{% url 'website:home' %}"
                    class="nav-link text-sm font-medium text-black/70 transition hover:text-black {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                >
                    Home
                </a>

                <a
                    href="{% url 'website:about' %}"
                    class="nav-link text-sm font-medium text-black/70 transition hover:text-black {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                >
                    About Us
                </a>

                <a
                    href="{% url 'website:services' %}"
                    class="nav-link text-sm font-medium text-black/70 transition hover:text-black {% if request.resolver_match.url_name == 'services' or request.resolver_match.url_name == 'service_detail' %}active{% endif %}"
                >
                    Services
                </a>

                <a
                    href="{% url 'website:blog' %}"
                    class="nav-link text-sm font-medium text-black/70 transition hover:text-black {% if request.resolver_match.url_name == 'blog' or request.resolver_match.url_name == 'post_detail' %}active{% endif %}"
                >
                    Insights
                </a>

            </nav>


            <!-- CTA -->

            <a
                href="{% url 'website:contact' %}"
                class="hidden items-center gap-2 rounded-full bg-numetric-green px-5 py-3 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-[#14572F] hover:shadow-lg hover:shadow-numetric-green/20 lg:inline-flex"
            >

                Let's Talk

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="h-4 w-4"
                    aria-hidden="true"
                >
                    <path
                        fill-rule="evenodd"
                        d="M3 10a.75.75 0 0 1 .75-.75h10.638l-4.219-4.22a.75.75 0 1 1 1.06-1.06l5.5 5.5a.75.75 0 0 1 0 1.06l-5.5 5.5a.75.75 0 1 1-1.06-1.06l4.219-4.22H3.75A.75.75 0 0 1 3 10Z"
                        clip-rule="evenodd"
                    />
                </svg>

            </a>


            <!-- MOBILE BUTTON -->

            <button
                id="mobile-menu-button"
                type="button"
                class="flex h-10 w-10 items-center justify-center rounded-full bg-numetric-dark text-white lg:hidden"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-menu"
            >

                <svg
                    id="menu-open-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.7"
                    stroke="currentColor"
                    class="h-5 w-5"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"
                    />

                </svg>


                <svg
                    id="menu-close-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.7"
                    stroke="currentColor"
                    class="hidden h-5 w-5"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 18 18 6M6 6l12 12"
                    />

                </svg>

            </button>

        </div>


        <!-- MOBILE NAV -->

        <div
            id="mobile-menu"
            class="mt-3 hidden rounded-3xl border border-black/10 bg-white p-5 shadow-2xl lg:hidden"
        >

            <nav
                class="flex flex-col"
                aria-label="Mobile navigation"
            >

                <a
                    href="{% url 'website:home' %}"
                    class="border-b border-black/5 py-4 text-sm font-medium"
                >
                    Home
                </a>

                <a
                    href="{% url 'website:about' %}"
                    class="border-b border-black/5 py-4 text-sm font-medium"
                >
                    About Us
                </a>

                <a
                    href="{% url 'website:services' %}"
                    class="border-b border-black/5 py-4 text-sm font-medium"
                >
                    Services
                </a>

                <a
                    href="{% url 'website:blog' %}"
                    class="border-b border-black/5 py-4 text-sm font-medium"
                >
                    Insights
                </a>

                <a
                    href="{% url 'website:contact' %}"
                    class="mt-5 flex min-h-12 items-center justify-center rounded-full bg-numetric-green px-5 text-sm font-semibold text-white"
                >
                    Let's Talk
                </a>

            </nav>

        </div>

    </div>

</header>


<script>

    const menuButton = document.getElementById(
        "mobile-menu-button"
    );

    const mobileMenu = document.getElementById(
        "mobile-menu"
    );

    const openIcon = document.getElementById(
        "menu-open-icon"
    );

    const closeIcon = document.getElementById(
        "menu-close-icon"
    );

    if (menuButton && mobileMenu) {

        menuButton.addEventListener(
            "click",
            function () {

                const open =
                    menuButton.getAttribute(
                        "aria-expanded"
                    ) === "true";

                menuButton.setAttribute(
                    "aria-expanded",
                    String(!open)
                );

                mobileMenu.classList.toggle(
                    "hidden",
                    open
                );

                openIcon.classList.toggle(
                    "hidden",
                    !open
                );

                closeIcon.classList.toggle(
                    "hidden",
                    open
                );

            }
        );


        mobileMenu
            .querySelectorAll("a")
            .forEach(function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                        mobileMenu.classList.add(
                            "hidden"
                        );

                        openIcon.classList.remove(
                            "hidden"
                        );

                        closeIcon.classList.add(
                            "hidden"
                        );

                    }
                );

            });

    }

</script>
