{# website/partials/page_hero.html #}

<section class="relative isolate overflow-hidden border-b border-black/10 bg-numetric-cream">

    <!-- ======================================================
         BACKGROUND ATMOSPHERE
    ======================================================= -->

    <div
        class="
            pointer-events-none
            absolute
            inset-0
            -z-10
            opacity-80
            bg-[radial-gradient(circle_at_82%_18%,rgba(27,107,58,0.12),transparent_38%),radial-gradient(circle_at_8%_90%,rgba(27,107,58,0.06),transparent_38%)]
        "
        aria-hidden="true"
    ></div>


    <!-- ======================================================
         SUBTLE GRID
    ======================================================= -->

    <div
        class="
            pointer-events-none
            absolute
            inset-0
            -z-10
            opacity-[0.035]
            [background-image:linear-gradient(to_right,#0A0D0B_1px,transparent_1px),linear-gradient(to_bottom,#0A0D0B_1px,transparent_1px)]
            [background-size:72px_72px]
        "
        aria-hidden="true"
    ></div>


    <!-- ======================================================
         LARGE BACKGROUND WORD
    ======================================================= -->

    <div
        class="
            pointer-events-none
            absolute
            -right-8
            bottom-[-1.5rem]
            -z-10
            select-none
            text-[8rem]
            font-semibold
            leading-none
            tracking-[-0.08em]
            text-numetric-green/[0.045]
            sm:text-[11rem]
            lg:text-[15rem]
        "
        aria-hidden="true"
    >
        {{ hero_word|default:"NUMETRIC" }}
    </div>


    <!-- ======================================================
         HERO CONTENT
    ======================================================= -->

    <div
        class="
            mx-auto
            max-w-7xl
            px-5
            py-16
            sm:px-6
            sm:py-20
            lg:px-8
            lg:py-24
        "
    >

        <div class="max-w-3xl">


            <!-- ==================================================
                 EYEBROW
            =================================================== -->

            <div class="flex items-center gap-3">

                <span
                    class="h-px w-8 bg-numetric-green"
                    aria-hidden="true"
                ></span>

                <p class="text-[11px] font-semibold uppercase tracking-[0.22em] text-numetric-green">
                    {{ hero_eyebrow }}
                </p>

            </div>


            <!-- ==================================================
                 HEADING
            =================================================== -->

            <h1
                class="
                    mt-5
                    max-w-3xl
                    text-4xl
                    font-medium
                    leading-[1.02]
                    tracking-[-0.045em]
                    text-numetric-dark
                    sm:text-5xl
                    lg:text-[4rem]
                "
            >
                {{ hero_heading }}
            </h1>


            <!-- ==================================================
                 DESCRIPTION
            =================================================== -->

            {% if hero_description %}

                <p
                    class="
                        mt-5
                        max-w-xl
                        text-sm
                        leading-6
                        text-numetric-muted
                        sm:text-base
                    "
                >
                    {{ hero_description }}
                </p>

            {% endif %}


            <!-- ==================================================
                 BREADCRUMB
            =================================================== -->

            <nav
                aria-label="Breadcrumb"
                class="
                    mt-7
                    flex
                    items-center
                    gap-2
                    text-xs
                "
            >

                <a
                    href="{% url 'website:home' %}"
                    class="
                        text-black/40
                        transition
                        hover:text-numetric-green
                    "
                >
                    Home
                </a>


                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="h-3.5 w-3.5 text-black/20"
                    aria-hidden="true"
                >

                    <path
                        fill-rule="evenodd"
                        d="M7.21 14.77a.75.75 0 0 1 .02-1.06L10.94 10 7.23 6.29a.75.75 0 1 1 1.06-1.06l4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1 0 1.06l-4.24 4.24a.75.75 0 0 1-1.06.02Z"
                        clip-rule="evenodd"
                    />

                </svg>


                <span class="font-medium text-numetric-dark">
                    {{ hero_title }}
                </span>

            </nav>

        </div>

    </div>


    <!-- ======================================================
         EDGE ACCENT
    ======================================================= -->

    <div
        class="
            pointer-events-none
            absolute
            bottom-0
            right-5
            h-16
            w-px
            bg-numetric-green/20
            sm:right-8
            lg:right-12
        "
        aria-hidden="true"
    ></div>

</section>
